<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Prank Portal | Cyber Hunter 71</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; }
        .heart-glow { text-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
    </style>
</head>
<body class="bg-gray-950 text-pink-400 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-pink-500 selection:text-white">

    <!-- Main Container -->
    <div class="w-full max-w-md bg-gray-900 border border-pink-500/40 rounded-xl shadow-2xl p-6 relative overflow-hidden backdrop-blur-md">
        
        <!-- Top Window Dots -->
        <div class="flex items-center justify-between border-b border-pink-500/20 pb-3 mb-6">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 bg-red-500 rounded-full inline-block animate-pulse"></span>
                <span class="w-3 h-3 bg-yellow-500 rounded-full inline-block"></span>
                <span class="w-3 h-3 bg-pink-500 rounded-full inline-block"></span>
            </div>
            <span class="text-xs tracking-wider text-pink-500/70">AUTO_PRANK_v7.1 (45s Interval)</span>
        </div>

        <!-- Header / Banner -->
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold tracking-widest text-pink-400 heart-glow">🚨 সাইবার ক্রাইম প্র্যাংক 🚨</h1>
            <p class="text-xs text-pink-600 mt-1">প্রতি ৪৫ সেকেন্ড পর পর অটো রিকুয়েস্ট যাবে...</p>
        </div>

        <!-- Confession Form -->
        <form id="prankForm" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-pink-400 mb-1">👤 আপনার নাম (Name):</label>
                <input type="text" id="name" required placeholder="যেমন: Cyber Police" 
                    class="w-full bg-gray-950 border border-pink-500/40 rounded px-3 py-2 text-pink-200 placeholder-pink-900 focus:outline-none focus:border-pink-400 text-sm">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-pink-400 mb-1">📱 যার নাম্বারে পাঠাবেন (Phone):</label>
                <input type="text" id="phone" required placeholder="যেমন: +8801961150461" 
                    class="w-full bg-gray-950 border border-pink-500/40 rounded px-3 py-2 text-pink-200 placeholder-pink-900 focus:outline-none focus:border-pink-400 text-sm">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs uppercase tracking-wider text-pink-400">💬 প্র্যাংক মেসেজ (Max 35 Chars):</label>
                    <span id="charCount" class="text-xs text-pink-500">0/35</span>
                </div>
                <input type="text" id="secretMsg" maxlength="35" required placeholder="যেমন: Case ID: CC-71 Cyber Alert!" 
                    class="w-full bg-gray-950 border border-pink-500/40 rounded px-3 py-2 text-pink-200 placeholder-pink-900 focus:outline-none focus:border-pink-400 text-sm">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-pink-600 hover:bg-pink-500 text-gray-950 font-bold py-2.5 px-4 rounded transition duration-200 uppercase tracking-widest text-sm cursor-pointer shadow-lg shadow-pink-900/50 flex items-center justify-center space-x-2">
                <span>অটো প্র্যাংক শুরু করুন (৪৫ সে.)</span> <span>⚡</span>
            </button>
        </form>

        <!-- Response Output Box -->
        <div id="outputContainer" class="hidden mt-6 pt-4 border-t border-pink-500/20">
            <p class="text-xs uppercase tracking-wider text-pink-400 mb-2">✨ লাইভ প্র্যাংক স্ট্যাটাস (প্রতি ৪৫ সে.):</p>
            <div id="responseBox" class="bg-gray-950 border border-pink-500/30 rounded p-3 text-xs text-pink-300 overflow-x-auto whitespace-pre-wrap leading-relaxed"></div>
        </div>

    </div>

    <!-- Footer credit -->
    <footer class="mt-6 text-xs text-pink-700 tracking-wider">
        Designed & Powered by Cyber Hunter 71 (CH71)
    </footer>

    <!-- JavaScript Logic with 45s Interval -->
    <script>
        let intervalId = null;

        // Character Counter for 35 Limit
        const msgInput = document.getElementById('secretMsg');
        const charCount = document.getElementById('charCount');
        msgInput.addEventListener('input', () => {
            const len = msgInput.value.length;
            charCount.innerText = `${len}/35`;
        });

        document.getElementById('prankForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const secretMsg = msgInput.value.trim();
            const btn = document.getElementById('submitBtn');
            const outputContainer = document.getElementById('outputContainer');
            const responseBox = document.getElementById('responseBox');

            if (intervalId) {
                clearInterval(intervalId); // আগের কোনো লুপ থাকলে থামিয়ে দিবে
            }

            outputContainer.classList.remove('hidden');
            responseBox.innerText = "🚀 অটো প্র্যাংক লুপ শুরু হয়েছে... প্রতি ৪৫ সেকেন্ড পর রিকুয়েস্ট যাচ্ছে।";
            btn.innerText = "Running (45s Interval)...";
            btn.disabled = true;

            async function sendRequest() {
                try {
                    const response = await fetch('/api/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            "name": name,
                            "phone_number": phone,
                            "business_name": secretMsg
                        })
                    });

                    const data = await response.text();
                    const now = new Date().toLocaleTimeString();
                    
                    responseBox.innerText = `[${now}] ✅ রিকুয়েস্ট সফলভাবে পাঠানো হয়েছে!\nTarget: ${phone}\nMessage: ${secretMsg}\nStatus: ${response.status}\n\nপরবর্তী রিকুয়েস্ট ৪৫ সেকেন্ড পর যাবে...`;

                } catch (error) {
                    const now = new Date().toLocaleTimeString();
                    responseBox.innerText = `[${now}] ❌ এরর: ${error.message}\nপরবর্তী রিকুয়েস্টের জন্য অপেক্ষা করা হচ্ছে...`;
                }
            }

            // প্রথমে একবার সাথে সাথে সেন্ড হবে
            sendRequest();

            // এরপর প্রতি ৪৫ সেকেন্ড (45000 milliseconds) পর পর লুপ চলতে থাকবে
            intervalId = setInterval(sendRequest, 45000);
        });
    </script>
</body>
</html>
