<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Confession Portal | Cyber Hunter 71</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; }
        .heart-glow { text-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
    </style>
</head>
<body class="bg-gray-950 text-pink-400 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-pink-500 selection:text-white">

    <!-- Main Container -->
    <div class="w-full max-w-md bg-gray-900 border border-pink-500/40 rounded-xl shadow-2xl p-6 relative overflow-hidden backdrop-blur-md">
        
        <!-- Top Window Dots -->
        <div class="flex items-center justify-between border-b border-pink-500/20 pb-3 mb-6">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 bg-red-500 rounded-full inline-block animate-pulse"></span>
                <span class="w-3 h-3 bg-yellow-500 rounded-full inline-block"></span>
                <span class="w-3 h-3 bg-pink-500 rounded-full inline-block"></span>
            </div>
            <span class="text-xs tracking-wider text-pink-500/70">SECRET_LOVE_ENCRYPTION_v7.1</span>
        </div>

        <!-- Header / Banner -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-widest text-pink-400 heart-glow">❤️ ক্রাশকে মনের কথা ❤️</h1>
            <p class="text-xs text-pink-600 mt-1">লুকিয়ে থাকা অনুভূতিগুলো সিক্রেট মেসেজে পাঠিয়ে দিন...</p>
        </div>

        <!-- Confession Form -->
        <form id="confessionForm" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-pink-400 mb-1">💌 আপনার ক্রাশের নাম (Crush Name):</label>
                <input type="text" id="crushName" required placeholder="যেমন: Nabila" 
                    class="w-full bg-gray-950 border border-pink-500/40 rounded px-3 py-2 text-pink-200 placeholder-pink-900 focus:outline-none focus:border-pink-400 text-sm">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-pink-400 mb-1">📱 যার নাম্বারে পাঠাবেন (Phone):</label>
                <input type="text" id="phone" required placeholder="যেমন: +8801837261524" 
                    class="w-full bg-gray-950 border border-pink-500/40 rounded px-3 py-2 text-pink-200 placeholder-pink-900 focus:outline-none focus:border-pink-400 text-sm">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-pink-400 mb-1">🤫 আপনার মনের গোপন কথা (Secret Message):</label>
                <textarea id="secretMsg" rows="3" required placeholder="যেমন: তোমাকে অনেক ভালো লাগে..." 
                    class="w-full bg-gray-950 border border-pink-500/40 rounded px-3 py-2 text-pink-200 placeholder-pink-900 focus:outline-none focus:border-pink-400 text-sm resize-none"></textarea>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-pink-600 hover:bg-pink-500 text-gray-950 font-bold py-2.5 px-4 rounded transition duration-200 uppercase tracking-widest text-sm cursor-pointer shadow-lg shadow-pink-900/50 flex items-center justify-center space-x-2">
                <span>সিক্রেট মেসেজ পাঠিয়ে দিন</span> <span>💘</span>
            </button>
        </form>

        <!-- Response Output Box -->
        <div id="outputContainer" class="hidden mt-6 pt-4 border-t border-pink-500/20">
            <p class="text-xs uppercase tracking-wider text-pink-400 mb-2">✨ এনক্রিপ্টেড লাভ লেটার স্ট্যাটাস:</p>
            <div id="responseBox" class="bg-gray-950 border border-pink-500/30 rounded p-3 text-xs text-pink-300 overflow-x-auto whitespace-pre-wrap leading-relaxed"></div>
        </div>

    </div>

    <!-- Footer credit -->
    <footer class="mt-6 text-xs text-pink-700 tracking-wider">
        Designed & Powered by Cyber Hunter 71 (CH71)
    </footer>

    <!-- JavaScript Logic -->
    <script>
        document.getElementById('confessionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const crushName = document.getElementById('crushName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const secretMsg = document.getElementById('secretMsg').value.trim();
            const btn = document.getElementById('submitBtn');
            const outputContainer = document.getElementById('outputContainer');
            const responseBox = document.getElementById('responseBox');

            // Button loading state
            btn.disabled = true;
            btn.innerText = "Encrypting Love Payload...";
            outputContainer.classList.remove('hidden');
            responseBox.innerText = "💌 সিক্রেট সার্ভারে লাভ সিগন্যাল পাঠানো হচ্ছে...";

            try {
                // Direct call to Vercel Serverless Python Backend Route
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        "name": crushName,
                        "phone_number": phone,
                        "business_name": secretMsg
                    })
                });

                const data = await response.text();
                
                // সুন্দর চিঠির মতো ফরম্যাট
                let letter = `💖 [Secret Love Letter Sent Successfully!] 💖\n\n`;
                letter += `Dear **${crushName}**,\n`;
                letter += `"${secretMsg}"\n\n`;
                letter += `───────────────────────────\n`;
                letter += `📱 Target Number: ${phone}\n`;
                letter += `🛡️ Status Code: ${response.status}\n`;
                letter += `💻 Secured by: Cyber Hunter 71 (CH71)`;

                responseBox.innerText = letter;

            } catch (error) {
                responseBox.innerText = `[!] লাভ সিগন্যাল ফেইল করেছে:\n${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = "<span>সিক্রেট মেসেজ পাঠিয়ে দিন</span> <span>💘</span>";
            }
        });
    </script>
</body>
</html>
