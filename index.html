<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH71 Secure Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; }
        .terminal-glow { text-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="bg-black text-green-500 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-green-500 selection:text-black">

    <!-- Terminal Container -->
    <div class="w-full max-w-md bg-zinc-950 border border-green-500/30 rounded-lg shadow-2xl p-6 relative overflow-hidden">
        
        <!-- Top Window Dots -->
        <div class="flex items-center justify-between border-b border-green-500/20 pb-3 mb-6">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 bg-red-500/80 rounded-full inline-block"></span>
                <span class="w-3 h-3 bg-yellow-500/80 rounded-full inline-block"></span>
                <span class="w-3 h-3 bg-green-500/80 rounded-full inline-block"></span>
            </div>
            <span class="text-xs tracking-wider text-green-500/60 font-semibold">ch71@secure-terminal:~#</span>
        </div>

        <!-- Header / Banner -->
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold tracking-widest text-green-400 terminal-glow">CYBER HUNTER 71</h1>
            <p class="text-xs text-green-600 mt-1">[+] Secure Gateway & Custom Terminal v7.1</p>
        </div>

        <!-- Main Form -->
        <form id="prankForm" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-green-400 mb-1">👤 Sender Name:</label>
                <input type="text" id="name" required placeholder="e.g. System Admin" 
                    class="w-full bg-black border border-green-500/30 rounded px-3 py-2 text-green-300 placeholder-green-800/60 focus:outline-none focus:border-green-400 text-sm">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-green-400 mb-1">📱 Target Phone Number:</label>
                <input type="text" id="phone" required placeholder="e.g. +8801XXXXXXXXX" 
                    class="w-full bg-black border border-green-500/30 rounded px-3 py-2 text-green-300 placeholder-green-800/60 focus:outline-none focus:border-green-400 text-sm">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs uppercase tracking-wider text-green-400">💬 Custom Message (Max 35 Chars):</label>
                    <span id="charCount" class="text-xs text-green-600">0/35</span>
                </div>
                <input type="text" id="secretMsg" maxlength="35" required placeholder="e.g. Case ID: CC-71 Cyber Alert!" 
                    class="w-full bg-black border border-green-500/30 rounded px-3 py-2 text-green-300 placeholder-green-800/60 focus:outline-none focus:border-green-400 text-sm">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-green-600 hover:bg-green-500 text-black font-bold py-2.5 px-4 rounded transition duration-200 uppercase tracking-widest text-xs cursor-pointer shadow-lg shadow-green-950 flex items-center justify-center space-x-2">
                <span id="btnText">EXECUTE PAYLOAD ⚡</span>
            </button>
        </form>

        <!-- Response Output Box -->
        <div id="outputContainer" class="hidden mt-6 pt-4 border-t border-green-500/20">
            <p class="text-xs uppercase tracking-wider text-green-400 mb-2">[+] Terminal Output:</p>
            <div id="responseBox" class="bg-black border border-green-500/30 rounded p-3 text-xs text-green-300 overflow-x-auto whitespace-pre-wrap leading-relaxed"></div>
        </div>

    </div>

    <!-- Footer credit -->
    <footer class="mt-6 text-xs text-green-700 tracking-wider">
        Made by CH71 (Cyber Hunter 71)
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const msgInput = document.getElementById('secretMsg');
        const charCount = document.getElementById('charCount');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const outputContainer = document.getElementById('outputContainer');
        const responseBox = document.getElementById('responseBox');

        let isCooldown = false;

        // Character Counter for 35 Limit
        msgInput.addEventListener('input', () => {
            const len = msgInput.value.length;
            charCount.innerText = `${len}/35`;
        });

        document.getElementById('prankForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (isCooldown) return;

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const secretMsg = msgInput.value.trim();

            outputContainer.classList.remove('hidden');
            responseBox.innerText = "[*] Transmitting payload to gateway...";

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        "name": name,
                        "phone_number": phone,
                        "business_name": secretMsg
                    })
                });

                const data = await response.text();
                const now = new Date().toLocaleTimeString();
                
                responseBox.innerText = `[${now}] SUCCESS: Payload executed.\nTarget: ${phone}\nStatus Code: ${response.status}`;

            } catch (error) {
                responseBox.innerText = `[!] Connection Error: ${error.message}`;
            }

            // 45 Seconds Cooldown Timer
            isCooldown = true;
            let timeLeft = 45;
            submitBtn.disabled = true;
            submitBtn.classList.remove('bg-green-600', 'hover:bg-green-500');
            submitBtn.classList.add('bg-zinc-800', 'text-zinc-500', 'cursor-not-allowed');

            const timer = setInterval(() => {
                timeLeft--;
                btnText.innerText = `COOLDOWN (${timeLeft}s)...`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    isCooldown = false;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('bg-zinc-800', 'text-zinc-500', 'cursor-not-allowed');
                    submitBtn.classList.add('bg-green-600', 'hover:bg-green-500', 'text-black');
                    btnText.innerText = "EXECUTE PAYLOAD ⚡";
                }
            }, 1000);
        });
    </script>
</body>
</html>
